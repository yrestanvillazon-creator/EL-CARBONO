
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL CARBONO | Huella, Contaminación y Descarbonización</title>

<style>
:root{
  --bg:#03110d;
  --bg2:#08251c;
  --card:rgba(255,255,255,.075);
  --text:#f2fff8;
  --muted:#b7d1c5;
  --green:#39e69b;
  --green2:#08c978;
  --cyan:#59e7ff;
  --yellow:#ffd166;
  --orange:#ff9f43;
  --red:#ff5570;
  --purple:#b98cff;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      #15543d 0,
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 15%,
      #103d51 0,
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #03110d,
      #061b15 55%,
      #020d0a
    );

  overflow-x:hidden;
}

/* =====================================================
   PARTÍCULAS DE FONDO
===================================================== */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;

  background-image:
    radial-gradient(
      rgba(255,255,255,.8) 1px,
      transparent 1px
    );

  background-size:45px 45px;

  opacity:.10;

  animation:backgroundMove 25s linear infinite;
}

@keyframes backgroundMove{
  to{
    background-position:180px 180px;
  }
}

/* =====================================================
   NAV
===================================================== */

nav{
  position:sticky;
  top:0;
  z-index:1000;

  background:
    rgba(2,15,11,.78);

  backdrop-filter:blur(18px);

  border-bottom:
    1px solid rgba(255,255,255,.1);
}

.navin{
  max-width:1250px;
  margin:auto;

  padding:13px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:900;
  font-size:1.05rem;
  letter-spacing:.5px;
}

.logo span{
  color:var(--green);
}

nav a{
  color:var(--muted);
  text-decoration:none;

  margin-left:15px;

  font-size:.86rem;

  transition:.25s;
}

nav a:hover{
  color:#fff;
}

.sound-btn{
  margin-left:12px;

  border:
    1px solid rgba(255,255,255,.15);

  background:
    rgba(255,255,255,.07);

  color:white;

  padding:8px 12px;

  border-radius:12px;

  cursor:pointer;
}

/* =====================================================
   HERO
===================================================== */

.hero{
  min-height:90vh;

  display:grid;
  place-items:center;

  padding:
    80px 20px
    50px;

  position:relative;
}

.hero-in{
  max-width:1250px;
  width:100%;

  display:grid;

  grid-template-columns:
    1.05fr
    .95fr;

  gap:60px;

  align-items:center;
}

.badge{
  display:inline-flex;

  padding:8px 14px;

  border-radius:999px;

  border:
    1px solid
    rgba(57,230,155,.35);

  background:
    rgba(57,230,155,.09);

  color:#caffea;

  font-size:.85rem;

  margin-bottom:20px;
}

h1{
  font-size:
    clamp(
      3rem,
      7vw,
      6.3rem
    );

  line-height:.91;

  letter-spacing:-5px;
}

h1 span{
  color:var(--green);

  text-shadow:
    0 0 35px
    rgba(57,230,155,.4);
}

.hero p{
  color:var(--muted);

  font-size:1.12rem;

  line-height:1.75;

  max-width:720px;

  margin:25px 0;
}

.btn{
  border:0;

  border-radius:14px;

  padding:
    13px 20px;

  font-weight:850;

  cursor:pointer;

  color:#042117;

  background:var(--green);

  box-shadow:
    0 10px 35px
    rgba(57,230,155,.2);

  transition:.25s;

  display:inline-block;

  text-decoration:none;
}

.btn:hover{
  transform:
    translateY(-3px)
    scale(1.02);
}

.btn.secondary{
  margin-left:8px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.13);

  color:white;
}

/* =====================================================
   PLANETA SVG
===================================================== */

.planet-wrap{
  position:relative;

  width:min(
    430px,
    80vw
  );

  aspect-ratio:1;

  margin:auto;
}

.planet{
  width:100%;
  height:100%;

  border-radius:50%;

  position:relative;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 35% 25%,
      #8affca 0 3%,
      #39bd87 15%,
      #13704f 35%,
      #07372b 65%,
      #031814 100%
    );

  box-shadow:
    0 0 80px
    rgba(57,230,155,.35),
    inset -40px -35px 70px
    rgba(0,0,0,.55);

  animation:
    planetFloat 5s ease-in-out infinite;
}

.planet::before{
  content:"";

  position:absolute;
  inset:11%;

  border-radius:50%;

  border:
    2px dashed
    rgba(89,231,255,.5);

  animation:
    planetSpin 16s linear infinite;
}

.planet::after{
  content:"🌱";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  font-size:6rem;

  filter:
    drop-shadow(
      0 0 18px
      rgba(57,230,155,.5)
    );
}

.orbit{
  position:absolute;

  inset:-10%;

  border:
    1px solid
    rgba(89,231,255,.25);

  border-radius:50%;

  transform:
    rotate(-20deg);

  animation:
    orbitSpin 12s linear infinite;
}

.orbit-dot{
  position:absolute;

  width:13px;
  height:13px;

  background:var(--cyan);

  border-radius:50%;

  top:4%;
  left:48%;

  box-shadow:
    0 0 20px
    var(--cyan);
}

@keyframes planetFloat{
  50%{
    transform:translateY(-15px);
  }
}

@keyframes planetSpin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes orbitSpin{
  to{
    transform:
      rotate(340deg);
  }
}

/* =====================================================
   SECCIONES
===================================================== */

section{
  max-width:1250px;

  margin:auto;

  padding:
    100px 20px;
}

.title{
  text-align:center;

  margin-bottom:45px;
}

.title h2{
  font-size:
    clamp(
      2rem,
      4vw,
      3rem
    );
}

.title p{
  color:var(--muted);

  margin-top:10px;

  line-height:1.6;
}

/* =====================================================
   CARDS
===================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;
}

.card{
  position:relative;

  padding:27px;

  border-radius:23px;

  background:
    rgba(255,255,255,.075);

  border:
    1px solid
    rgba(255,255,255,.1);

  box-shadow:var(--shadow);

  overflow:hidden;

  transition:.35s;
}

.card::before{
  content:"";

  position:absolute;

  width:120px;
  height:120px;

  right:-50px;
  top:-50px;

  border-radius:50%;

  background:
    rgba(57,230,155,.12);

  filter:blur(5px);
}

.card:hover{
  transform:
    translateY(-9px);

  border-color:
    rgba(57,230,155,.45);
}

.icon{
  font-size:2.5rem;

  margin-bottom:15px;
}

.card h3{
  margin-bottom:9px;
}

.card p{
  color:var(--muted);

  line-height:1.65;
}

/* =====================================================
   REVEAL
===================================================== */

.reveal{
  opacity:0;

  transform:
    translateY(35px);

  transition:
    opacity .8s ease,
    transform .8s ease;
}

.reveal.show{
  opacity:1;

  transform:none;
}

/* =====================================================
   ESCENA CONTAMINACIÓN
===================================================== */

.pollution-scene{
  height:590px;

  position:relative;

  overflow:hidden;

  border-radius:32px;

  background:
    linear-gradient(
      180deg,
      #102d3b 0%,
      #173e42 48%,
      #24533b 49%,
      #071a15 100%
    );

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:var(--shadow);
}

/* Sol */

.sun{
  position:absolute;

  width:95px;
  height:95px;

  border-radius:50%;

  right:80px;
  top:45px;

  background:#ffd36b;

  box-shadow:
    0 0 80px
    rgba(255,190,80,.8);

  animation:
    sunPulse 3s infinite;
}

@keyframes sunPulse{
  50%{
    box-shadow:
      0 0 110px
      rgba(255,190,80,.95);
  }
}

/* Nubes contaminantes */

.pollution-cloud{
  position:absolute;

  font-size:3rem;

  filter:
    grayscale(1)
    blur(1px);

  opacity:.7;

  animation:
    cloudMove 12s linear infinite;
}
