<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL CARBONO | Huella, Contaminación y Descarbonización</title>

<style>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#06150f;
color:#f2fff8;
line-height:1.6;
}

nav{
position:sticky;
top:0;
z-index:100;
background:#03100b;
padding:14px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
border-bottom:1px solid #214b38;
}

nav a{
color:white;
text-decoration:none;
padding:8px 14px;
border-radius:20px;
}

nav a:hover{
background:#17442f;
color:#8fffc1;
}

.hero{
text-align:center;
padding:80px 20px;
background:
radial-gradient(circle at center,#174a32,#06150f 65%);
}

.hero h1{
font-size:clamp(50px,10vw,100px);
margin:20px 0;
color:#67eca4;
}

.hero p{
max-width:800px;
margin:auto;
font-size:20px;
color:#bdd5c7;
}

.globo{
width:180px;
height:180px;
margin:20px auto;
border-radius:50%;
background:
radial-gradient(circle at 35% 30%,#d5ffe6,#54df98 25%,#11613e 60%,#031b11 80%);
box-shadow:0 0 60px rgba(86,227,159,.4);
animation:flotar 4s infinite ease-in-out;
}

@keyframes flotar{
50%{
transform:translateY(-12px);
}
}

.boton{
display:inline-block;
border:none;
padding:15px 22px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.boton-verde{
background:#50e59a;
color:#032014;
}

section{
max-width:1100px;
margin:auto;
padding:70px 20px;
}

.titulo{
text-align:center;
margin-bottom:40px;
}

.titulo h2{
font-size:42px;
margin-bottom:10px;
}

.titulo p{
color:#b8d0c3;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.card{
background:#0d2c20;
border:1px solid #1d4d39;
border-radius:20px;
padding:25px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
border-color:#4ee69a;
}

.icono{
font-size:45px;
}

.card p{
color:#b8d0c3;
}

.escena{
height:300px;
background:linear-gradient(#719589 0 60%,#172c23 60%);
border-radius:25px;
position:relative;
overflow:hidden;
}

.ciudad{
position:absolute;
bottom:40%;
left:0;
width:100%;
height:90px;
background:
repeating-linear-gradient(
90deg,
#17231e 0 55px,
#2a4036 55px 90px
);
}

.fabrica{
position:absolute;
left:15%;
bottom:40%;
width:120px;
height:100px;
background:#3a4c43;
}

.chimenea{
position:absolute;
right:10px;
top:-70px;
width:25px;
height:75px;
background:#273a32;
}

.humo{
position:absolute;
left:40%;
top:20%;
width:70px;
height:70px;
border-radius:50%;
background:#4d5651;
opacity:.55;
animation:humo 5s infinite;
}

@keyframes humo{
50%{
transform:translate(30px,-20px);
opacity:.2;
}
}

.carro{
position:absolute;
bottom:30%;
width:90px;
height:28px;
background:#c85c4b;
border-radius:15px;
animation:carro 7s linear infinite;
}

@keyframes carro{
from{
left:-100px;
}
to{
left:110%;
}
}

.carro2{
background:#d7a83f;
bottom:22%;
animation-delay:3s;
}

.calculadora{
background:#092319;
border:1px solid #24543e;
border-radius:25px;
padding:30px;
max-width:900px;
margin:auto;
}

.control{
margin:28px 0;
}

.control label{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:10px;
}

.valor{
color:#8fffc1;
font-weight:bold;
}

input[type="range"]{
width:100%;
accent-color:#4ee69a;
cursor:pointer;
height:8px;
}

.resultados{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:30px;
}

.resultado{
background:#0d3021;
border:1px solid #23543e;
border-radius:18px;
padding:20px;
text-align:center;
}

.resultado strong{
display:block;
font-size:30px;
color:#8fffc1;
margin:8px;
}

.barra{
height:18px;
background:#17372a;
border-radius:20px;
overflow:hidden;
margin:25px 0;
}

#barra{
display:block;
height:100%;
width:0%;
background:#4ee69a;
transition:.3s;
}

#grafica{
width:100%;
max-width:100%;
height:280px;
background:#06150f;
border-radius:15px;
margin-top:20px;
}

.estado{
text-align:center;
color:#8fffc1;
min-height:30px;
margin-top:15px;
}

.transicion{
height:280px;
background:linear-gradient(#164333,#092017);
border-radius:25px;
position:relative;
overflow:hidden;
}

.sol{
position:absolute;
right:10%;
top:15%;
width:70px;
height:70px;
border-radius:50%;
background:#ffd66b;
box-shadow:0 0 40px #ffd66b;
}

.fabrica2{
position:absolute;
left:10%;
bottom:0;
font-size:100px;
transition:.4s;
}

.viento{
position:absolute;
right:25%;
bottom:20%;
font-size:70px;
}

.arboles{
position:absolute;
left:55%;
bottom:0;
font-size:70px;
}

.etiquetas{
display:flex;
justify-content:space-between;
color:#b8d0c3;
margin:10px 0;
}

footer{
text-align:center;
padding:50px 20px;
border-top:1px solid #214b38;
color:#b8d0c3;
}

#sonido{
position:fixed;
right:20px;
bottom:20px;
width:50px;
height:50px;
border-radius:50%;
border:1px solid #285940;
background:#0b291c;
color:white;
font-size:20px;
cursor:pointer;
}

@media(max-width:600px){

.titulo h2{
font-size:32px;
}

.calculadora{
padding:20px;
}

.control label{
flex-direction:column;
}

}
</style>
</head>
